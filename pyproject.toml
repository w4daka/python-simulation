[project]
name = "python-simulation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "debugpy>=1.8.21",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-benchmark>=5.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]

[tool.basedpyright]
typeCheckingMode = "strict"
[tool.ruff.lint]
extend-select = ["ANN"]
[tool.coverage.run]
branch = true
